name: Codex Runner Relay
version: "0.2.8"
slug: codex_runner_relay
description: "Runner Center v2 的最小权限出站 WSS 传输中继。"
url: "https://github.com/kongweiteng/home-assistant-addons/tree/main/codex_runner_relay"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
stage: experimental
backup: cold
ingress: false
watchdog: "http://[HOST]:[PORT:8098]/healthz"
ports:
  8098/tcp: null
ports_description:
  8098/tcp: "仅供 Add-on 内部网络和经批准的反向代理使用"
options:
  controller_base_url: "http://local-codex-controller:8102"
  controller_api_token: ""
  relay_api_token: ""
  max_connections: 64
  max_message_bytes: 524288
  first_frame_timeout_seconds: 10
  messages_per_minute: 1200
  controller_timeout_seconds: 10
schema:
  controller_base_url: str
  controller_api_token: password
  relay_api_token: password
  max_connections: "int(1,1024)"
  max_message_bytes: "int(4096,1048576)"
  first_frame_timeout_seconds: "int(3,60)"
  messages_per_minute: "int(10,10000)"
  controller_timeout_seconds: "int(2,60)"
