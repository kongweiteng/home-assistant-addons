name: HA Operations Broker
version: "0.1.0"
slug: ha_operations_broker
description: "Experimental read-only preflight broker for approved Home Assistant operation proposals."
url: "https://github.com/kongweiteng/home-assistant-addons/tree/main/ha_operations_broker"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
stage: experimental
hassio_api: true
hassio_role: default
ports:
  8098/tcp: null
ports_description:
  8098/tcp: "Internal-only authenticated preflight API; never maps a host port"
watchdog: "http://[HOST]:[PORT:8098]/healthz"
options:
  broker_api_token: ""
  trusted_owner_identity_hashes: []
  max_request_bytes: 32768
  supervisor_timeout_seconds: 5
schema:
  broker_api_token: "password"
  trusted_owner_identity_hashes:
    - "match(^[a-f0-9]{64}$)"
  max_request_bytes: "int(4096,65536)"
  supervisor_timeout_seconds: "int(1,30)"
