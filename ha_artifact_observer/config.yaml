name: HA Artifact Observer
version: "0.0.5"
slug: ha_artifact_observer
description: "Default-off fixed-target artifact observer; explicit instance authorization required."
arch: [amd64, aarch64]
init: false
startup: application
boot: manual
stage: experimental
docker_api: false
hassio_api: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Internal authenticated observation and health; no host mapping"
options:
  observation_enabled: false
  docker_socket_enabled: false
  docker_api_version: "v1.44"
  timeout_seconds: 3
  max_response_bytes: 1048576
  bindings: []
  principals: []
schema:
  observation_enabled: bool
  docker_socket_enabled: bool
  docker_api_version: match(v1\.[0-9]{2})
  timeout_seconds: float(0.05,30)
  max_response_bytes: int(4096,4194304)
  bindings:
    - target_ref: str
      instance_ref: str
      slug: str
      container_name: str
  principals:
    - principal_ref: str
      token: password
      target_refs:
        - str
