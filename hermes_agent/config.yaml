name: Hermes Agent
version: "1.8.0"
slug: hermes_agent
description: "The self-improving AI agent built by Nous Research. Home Assistant add-on by Wolfram Ravenwolf."
url: "https://github.com/WolframRavenwolf/hermes-ha-addon"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 49169
ingress_stream: true
homeassistant_api: true
panel_icon: mdi:robot
panel_title: Hermes Agent
map:
  - addon_config:rw
  - media:rw
  - share:rw
ports:
  8080/tcp: null
  8443/tcp: 8443
  9119/tcp: null
ports_description:
  8080/tcp: "HTTP: /hermes/ (agent) · /dashboard/ (web UI) · /terminal/ (shell) · /v1/ (OpenAI API)"
  8443/tcp: "HTTPS: /hermes/ (agent) · /dashboard/ (web UI) · /terminal/ (shell) · /v1/ (OpenAI API) — TLS (self-signed cert)"
  9119/tcp: "Hermes Desktop remote backend — opt-in; trusted LAN/VPN/Tailscale only"
options:
  git_url: "https://github.com/NousResearch/hermes-agent.git"
  git_ref: ""
  git_token: ""
  auto_update: false
  hass_url: "http://homeassistant.local:8123"
  homeassistant_token: ""
  ha_control_allowed_domains:
    - "light"
  ha_control_allowed_entities: []
  ha_health_entities: []
  ha_health_status_entities: []
  ha_health_stale_after_seconds: 300
  ha_operations_approval_enabled: false
  ha_operations_owner_identity_hashes: []
  ha_operations_proposal_ttl_seconds: 600
  ha_operations_max_pending: 20
  notification_bridge_enabled: false
  notification_mqtt_host: "core-mosquitto"
  notification_mqtt_port: 1883
  notification_mqtt_username: ""
  notification_mqtt_password: ""
  notification_mqtt_tls: false
  notification_allowed_audiences:
    - "owner"
  hermes_home: ".hermes"
  profiles: []
  profiles_base: ".hermes/profiles"
  profile_env_vars: []
  enable_dashboard: false
  enable_terminal: false
  enable_api: false
  enable_desktop_backend: false
  access_password: ""
  env_vars:
    - name: "OPENROUTER_API_KEY"
      value: ""
schema:
  git_url: "url?"
  git_ref: "str?"
  git_token: "password?"
  auto_update: "bool"
  hass_url: "url?"
  homeassistant_token: "password?"
  ha_control_allowed_domains:
    - "str"
  ha_control_allowed_entities:
    - "str"
  ha_health_entities:
    - metric: "match(^(disk_total_bytes|disk_used_bytes|disk_free_bytes|disk_used_percent|recorder_bytes|backup_count|backup_bytes|top_consumer)$)"
      entity_id: "match(^sensor\\.[a-z0-9_]+$)"
  ha_health_status_entities:
    - entity_id: "match(^binary_sensor\\.[a-z0-9_]+$)"
      expected_state: "match(^(on|off)$)"
  ha_health_stale_after_seconds: "int(30,86400)"
  ha_operations_approval_enabled: "bool"
  ha_operations_owner_identity_hashes:
    - "match(^[a-f0-9]{64}$)"
  ha_operations_proposal_ttl_seconds: "int(60,3600)"
  ha_operations_max_pending: "int(1,100)"
  notification_bridge_enabled: "bool"
  notification_mqtt_host: "str"
  notification_mqtt_port: "port"
  notification_mqtt_username: "str?"
  notification_mqtt_password: "password?"
  notification_mqtt_tls: "bool"
  notification_allowed_audiences:
    - "match(^[A-Za-z0-9_][A-Za-z0-9_.:-]{0,254}$)"
  hermes_home: "str?"
  profiles:
    - "str"
  profiles_base: "str?"
  profile_env_vars:
    - profile: "str"
      name: "match(^[A-Z_][A-Z0-9_]{0,254}$)"
      value: "str"
  enable_dashboard: "bool"
  enable_terminal: "bool"
  enable_api: "bool"
  enable_desktop_backend: "bool"
  access_password: "password?"
  env_vars:
    - name: "match(^[A-Z_][A-Z0-9_]{0,254}$)"
      value: "str"
