name: HA Operations Broker
version: "0.5.1"
slug: ha_operations_broker
description: "默认禁用、由 Passkey 授权且只允许精确白名单 Add-on 重启的 Home Assistant 操作代理。"
url: "https://github.com/kongweiteng/home-assistant-addons/tree/main/ha_operations_broker"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
stage: experimental
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8098
panel_icon: mdi:shield-key
panel_title: HA 操作审批
panel_admin: true
ports:
  8098/tcp: null
ports_description:
  8098/tcp: "Ingress and internal authenticated API; never maps a host port"
watchdog: "http://[HOST]:[PORT:8098]/healthz"
options:
  broker_api_token: ""
  recovery_api_token: ""
  backup_evidence_api_token: ""
  trusted_owner_identity_hashes: []
  max_request_bytes: 32768
  supervisor_timeout_seconds: 5
  webauthn_rp_id: ""
  webauthn_allowed_origins: []
  passkey_enrollment_token: ""
  passkey_challenge_ttl_seconds: 180
  max_passkeys: 8
  max_pending_passkey_flows: 100
  proposal_ttl_seconds: 600
  policy_epoch: 1
  policy_hash: "sha256:c408de9e17185d22a780c6e5bca8cb3ad7cb092f46cdfe9a35fe1ecd6a3719b8"
  adapter_version: "manager-restart-v1"
  adapter_schema_version: 1
  lease_ttl_seconds: 30
  manager_shadow_enabled: false
  manager_executor_base_url: ""
  manager_executor_api_token: ""
  execution_enabled: false
  enabled_actions: []
  restart_addon_allowlist: []
schema:
  broker_api_token: "password"
  recovery_api_token: "password"
  backup_evidence_api_token: "password"
  trusted_owner_identity_hashes:
    - "match(^[a-f0-9]{64}$)"
  max_request_bytes: "int(4096,65536)"
  supervisor_timeout_seconds: "int(1,30)"
  webauthn_rp_id: str
  webauthn_allowed_origins:
    - url
  passkey_enrollment_token: password
  passkey_challenge_ttl_seconds: "int(60,600)"
  max_passkeys: "int(1,32)"
  max_pending_passkey_flows: "int(10,500)"
  proposal_ttl_seconds: "int(60,1800)"
  policy_epoch: "int(1,2147483647)"
  policy_hash: "match(^sha256:[a-f0-9]{64}$)"
  adapter_version: "match(^[a-z][a-z0-9_.-]{0,63}$)"
  adapter_schema_version: "int(1,2147483647)"
  lease_ttl_seconds: "int(5,300)"
  manager_shadow_enabled: bool
  manager_executor_base_url: str
  manager_executor_api_token: password
  execution_enabled: bool
  enabled_actions:
    - "match(^(restart_addon)$)"
  restart_addon_allowlist:
    - "match(^[a-z0-9][a-z0-9_]{0,63}$)"
