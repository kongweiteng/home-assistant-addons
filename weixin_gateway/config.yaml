name: Weixin Gateway
version: "0.2.1"
slug: weixin_gateway
description: "承载单一微信 iLink 身份、独立会话与安全多用户管理的最小网关。"
url: "https://github.com/kongweiteng/home-assistant-addons/tree/main/weixin_gateway"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
stage: experimental
backup: cold
ingress: true
ingress_port: 8103
panel_icon: mdi:wechat
panel_title: 微信网关
panel_admin: true
watchdog: "http://[HOST]:[PORT:8103]/healthz"
ports:
  8103/tcp: null
ports_description:
  8103/tcp: "仅供 Home Assistant Ingress 和受认证附件 API 使用"
options:
  attachment_api_token: ""
  poller_enabled: false
  owner_pairing_enabled: false
  activation_confirmation: ""
  controller_base_url: ""
  controller_api_token: ""
  account_id: ""
  ilink_token: ""
  ilink_base_url: "https://ilinkai.weixin.qq.com"
  cdn_base_url: "https://novac2c.cdn.weixin.qq.com/c2c"
  self_user_id: ""
  allowed_user_ids: []
  max_media_bytes: 20971520
  spool_ttl_seconds: 86400
  notification_bridge_enabled: false
  notification_mqtt_host: ""
  notification_mqtt_port: 1883
  notification_mqtt_username: ""
  notification_mqtt_password: ""
  notification_mqtt_tls: false
  notification_allowed_audiences:
    - "owner"
  remote_work_enabled: false
  remote_work_mqtt_host: ""
  remote_work_mqtt_port: 1883
  remote_work_mqtt_username: ""
  remote_work_mqtt_password: ""
  remote_work_mqtt_tls: false
  remote_work_ttl_seconds: 1800
schema:
  attachment_api_token: password
  poller_enabled: bool
  owner_pairing_enabled: bool
  activation_confirmation: str
  controller_base_url: str
  controller_api_token: password
  account_id: str
  ilink_token: password
  ilink_base_url: url
  cdn_base_url: url
  self_user_id: str
  allowed_user_ids:
    - str
  max_media_bytes: "int(1024,52428800)"
  spool_ttl_seconds: "int(300,604800)"
  notification_bridge_enabled: bool
  notification_mqtt_host: str
  notification_mqtt_port: "int(1,65535)"
  notification_mqtt_username: "str?"
  notification_mqtt_password: "password?"
  notification_mqtt_tls: bool
  notification_allowed_audiences:
    - str
  remote_work_enabled: bool
  remote_work_mqtt_host: str
  remote_work_mqtt_port: "int(1,65535)"
  remote_work_mqtt_username: "str?"
  remote_work_mqtt_password: "password?"
  remote_work_mqtt_tls: bool
  remote_work_ttl_seconds: "int(60,3600)"
