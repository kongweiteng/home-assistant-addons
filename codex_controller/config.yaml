name: Codex Controller
version: "0.5.3"
slug: codex_controller
description: "基于官方 Codex app-server 的持久任务、认证与受限工具控制器。"
url: "https://github.com/kongweiteng/home-assistant-addons/tree/main/codex_controller"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: manual
stage: experimental
backup: cold
ingress: true
ingress_port: 8102
panel_icon: mdi:robot-outline
panel_title: Codex 控制器
panel_admin: true
watchdog: "http://[HOST]:[PORT:8102]/healthz"
ports:
  8102/tcp: null
ports_description:
  8102/tcp: "仅供 Home Assistant Ingress 和内部作业 API 使用"
options:
  internal_api_token: ""
  intake_enabled: false
  auth_mode: chatgpt_device_code
  openai_api_key: ""
  openai_base_url: ""
  codex_model: ""
  ledger_base_url: ""
  ledger_api_token: ""
  gateway_base_url: ""
  gateway_attachment_token: ""
  operations_base_url: ""
  operations_api_token: ""
  memo_base_url: ""
  memo_http_username: ""
  memo_http_password: ""
  memo_api_token: ""
  max_request_bytes: 1048576
  max_queue: 200
  max_result_chars: 12000
  max_media_bytes: 1073741824
  runner_center_v2_enabled: true
  runner_online_seconds: 30
  runner_offline_seconds: 90
  runner_lease_ttl_seconds: 60
  runner_task_ttl_seconds: 1800
  runner_relay_base_url: ""
  runner_relay_api_token: ""
  runner_relay_controller_api_token: ""
  runner_relay_public_url: ""
  runner_installer_manifest_url: ""
  runner_installer_manifest_sha256: ""
  runner_relay_timeout_seconds: 10
schema:
  internal_api_token: password
  intake_enabled: bool
  auth_mode: "list(chatgpt_device_code|api_key)"
  openai_api_key: password
  openai_base_url: str
  codex_model: str
  ledger_base_url: str
  ledger_api_token: password
  gateway_base_url: str
  gateway_attachment_token: password
  operations_base_url: str
  operations_api_token: password
  memo_base_url: str
  memo_http_username: str
  memo_http_password: password
  memo_api_token: password
  max_request_bytes: "int(4096,52428800)"
  max_queue: "int(1,5000)"
  max_result_chars: "int(1000,32000)"
  max_media_bytes: "int(1048576,4294967296)"
  runner_center_v2_enabled: bool
  runner_online_seconds: "int(5,300)"
  runner_offline_seconds: "int(10,900)"
  runner_lease_ttl_seconds: "int(5,3600)"
  runner_task_ttl_seconds: "int(60,86400)"
  runner_relay_base_url: str
  runner_relay_api_token: password
  runner_relay_controller_api_token: password
  runner_relay_public_url: str
  runner_installer_manifest_url: str
  runner_installer_manifest_sha256: str
  runner_relay_timeout_seconds: "int(2,60)"
